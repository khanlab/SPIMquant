intro: Outputs of one full-resolution brain, as SPIMquant writes them. Every file is described in the
  [output reference](../reference/outputs.md).
dataset: one mouse brain (sub-AS40F2), 4x Imaris scan, 339 GB
resolution: "1.625 \xD7 1.625 \xD7 2.75 \xB5m"
stains: Abeta (LANTERN), CD31 (vesselFM), YoPro (registration)
spimquant_version: 'v0.13.0 + #255 + #256 (f566389)'
