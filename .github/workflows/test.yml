---
name: Lint and test workflow
on:
  push:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.base_ref }}

      - name: Setup Python environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: >-
            dev-only
          activate-environment: dev-only

      - name: isort
        run: isort spimquant/*.py -c --profile black

      - name: Black
        run: black spimquant --check

      - name: snakefmt
        run: snakefmt spimquant --check

  test:
    runs-on: ubuntu-latest
    needs: ["quality"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          activate-environment: true
      
      - name: Dry-run Test
        run: |
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds test_out participant -np

      - name: Dry-run Test with MRI reg
        run: |
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds_withmri test_out participant -np --register-to-mri

      - name: Dry-run Test with MRI reg, no segmentation
        run: |
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds_withmri test_out participant -np --register-to-mri --no-segmentation

      # a cohort template needs 2+ subjects: add a second, linked to the first
      - name: Dry-run Test with --reg-cohort-template
        run: |
          ds=$RUNNER_TEMP/bids_ds2
          cp -r $GITHUB_WORKSPACE/tests/bids_ds $ds
          mkdir -p $ds/sub-B/micr
          ln -s $ds/sub-AS36F2/micr/sub-AS36F2_sample-brain_acq-downsampled_SPIM.ome.zarr $ds/sub-B/micr/sub-B_sample-brain_acq-downsampled_SPIM.ome.zarr
          printf 'sub-B\tcontrol\t12\tM\n' >> $ds/participants.tsv
          printf 'sub-B\tsample-brain\ttissue\n' >> $ds/samples.tsv
          ./spimquant/run.py $ds test_out participant -np --reg-cohort-template
          ./spimquant/run.py $ds test_out participant -np --executor slurm -j 1 --reg-cohort-template

      # Job groups are only enforced by non-local executors, so a local dry run
      # cannot catch a rule missing from a group (e.g. subj_quant). The slurm
      # plugin builds the grouped DAG without needing sbatch for a dry run.
      - name: Dry-run Test with job groups (slurm executor), two seg stains + coloc
        run: |
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds test_out participant -np --executor slurm -j 1 --sample_staining AutoF abeta Iba1
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds test_out participant -np --executor slurm -j 1 --sample_staining AutoF abeta Iba1 CD31 --object_method cc inst --qc_instance_seg
          ./spimquant/run.py $GITHUB_WORKSPACE/tests/bids_ds_withmri test_out participant -np --executor slurm -j 1 --register-to-mri
