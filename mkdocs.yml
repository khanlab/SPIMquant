site_name: SPIMquant Documentation
site_url: https://spimquant.readthedocs.io/en/latest/
site_description: Quantitative analysis of SPIM (lightsheet) brain data
site_author: Ali Khan

repo_name: khanlab/SPIMquant
repo_url: https://github.com/khanlab/SPIMquant

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting_started/installation.md
      - Quick start: getting_started/quickstart.md
      - Input data: getting_started/input_data.md
      - Example outputs: examples/index.md
  - How it works: workflow_overview.md
  - Guides:
      - Running SPIMquant: usage/running.md
      - Segmentation: howto/segmentation.md
      - Registration methods: howto/registration_methods.md
      - Cohort templates: howto/cohort_template.md
      - MRI registration: howto/mri_registration.md
      - Multiple scans of a sample: howto/multiple_scans.md
      - Reusing outputs: howto/reuse_derivatives.md
      - Template-space data, crops and patches: howto/template_space_outputs.md
      - Dataset QC report: howto/dataset_qc.md
      - Group analysis: usage/group_analysis.md
      - Group QC report: howto/group_qc.md
      - Adding a deep-learning model: howto/deep_learning_models.md
  - Reference:
      - Command line: reference/cli.md
      - Output files: reference/outputs.md
      - Templates: reference/templates.md
      - Configuration keys: reference/config.md
      - Workflow graphs: reference/workflow.md
  - FAQ: faq.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - toc:
      toc_depth: 3
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

hooks:
  - docs/hooks.py

# generator code and its data (see AGENTS.md), not pages
exclude_docs: |
  gen/
  generated/

validation:
  links:
    unrecognized_links: warn
    anchors: warn
