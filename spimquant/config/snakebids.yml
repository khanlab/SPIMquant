#list of analysis levels in the bids app
analysis_levels: &analysis_levels
 - participant
 - group
 - tune_n4
 - cohort_template
 - cohort_template_export
 - templates

#mapping from analysis_level to set of target rules or files
targets_by_analysis_level:
  participant:
    - 'all_participant'  # if '', then the first rule is run
  group:
    - 'all_group'
  tune_n4:
    - 'all_n4_tune'
  cohort_template:
    - 'all_cohort_template'
  cohort_template_export:
    - 'all_cohort_template_export'
  templates: # download and import the chosen template, e.g. on a login node
    - 'all_templates'

# Configure components:
# Each entry creates a new component that can be retreived within the workflow
# via `generate_inputs`.
# Filters are used to select paths: each filter has an `entity` key and a
# single value or list of values to select.
# Wildcards are used to mark variable parts of paths. Each wildcard is an
# entity, such as `subject` or `session`, that may vary across component paths.
pybids_inputs:
  spim:
    filters:
      suffix: 'SPIM'
      extension:
        - ome.zarr
        - ims
      sample: brain
    wildcards:
      - subject
      - session
      - sample
      - acquisition
      - staining
      - extension
  mri:
    filters:
      suffix: 'T2w'
      extension: 'nii.gz'
      datatype: 'anat'
    wildcards:
      - subject
      - session
      - acquisition
      - run
      - reconstruction
      - suffix
      - extension


#configuration for the command-line parameters to make available
# passed on the argparse add_argument()
parse_args:
  --work_dir:
    help: "Local path to use for temporary files\n"
    type: str
    dest: work
    default: null

  --template:
    help: "Template to use for SPIM registration\n"
    default: ABAv3
    choices: 
     - ABAv3
     - DSURQE
     - gubra
     - MBMv3
     - turone

  --atlas_segs:
    help: "Atlas segmentations to use with the chosen template (default: predefined list or all)"
    default: null
    action: store
    nargs: '+'

  --template_crop:
    help: "Crop template along X-axis to retain specific hemisphere for registration (default: %(default)s)"
    choices: 
      - left
      - right
    default: null

  --sample_staining:
    help: "Override sample staining for input data. When absent, sample staining are read from OME-Zarr channel_labels metadata and overridden by _SPIM.json sidecars (SampleStaining key) if present. CLI values take highest precedence."
    default: null
    action: store
    nargs: '+'

  --ignore_stains:
    help: "Stain(s) to ignore when setting up the workflow. Can use this option to make the dataset staining uniform (e.g. by ignoring stains that are not present in all the subjects)."
    default: null
    action: store
    nargs: '+'

  --stains_for_reg:
    help: "Possible stains to use for registration (will choose first available, in order)\n (default: %(default)s)"
    default: 
      - PI
      - YOPRO
      - YoPro
      - YoPro1
      - AutoF
      - autof
    action: store
    nargs: '+'

  --stains_for_seg:
    help: "List of stains to use for segmentation and quantification (will segment any that match the data)\n (default: %(default)s)"
    default: 
      - abeta
      - Abeta
      - BetaAmyloid
      - AlphaSynuclein
      - Iba1
      - NeuN
      - Olig2
      - ChAT
      - VAChT
      - Thy1GFP
    action: store
    nargs: '+'

  --stains_for_vessels:
    help: "List of stains to use for vessel segmentation and quantification (will choose first available, in order)\n (default: %(default)s)"
    default: 
      - CD31
      - Lectin
    action: store
    nargs: '+'

  --registration_level:
    help: "Downsampling level to use for registration (level 0 is full res, level 1 is typically downsampled by 2, ...) (default: 5)"
    type: int
    default: 5

  --segmentation_level:
    help: "Downsampling level to use for segmentation (including vessels) (level 0 is full res, level 1 is typically downsampled by 2, ...) (default: 0)"
    type: int
    default: 0

  --no_segmentation:
    help: "Skip segmentation and quantification of stains, i.e. perform registration only (default: %(default)s)"
    action: store_true
    default: False

  --no_vessels:
    help: "Skip segmentation and quantification of vessels (default: %(default)s)"
    action: store_true
    default: False

  --correction_method:
    help: "Method to use for intensity non-uniformity correction, prior to performing segmentation (default: %(default)s)"
    choices: 
      - gaussian
      - n4
    default: n4

  --correction_level:
    help: "Pyramid level at which to perform bias field correction (default: %(default)s). Higher values (coarser resolution) may be needed for high-resolution datasets; lower values for low-resolution datasets."
    default: 6
    type: int


  --correction_n4_iters:
    help: "Number of iterations to use at each multi-res level (default: %(default)s). Higher values should provide more correction."
    default: 200
    type: int

  --correction_n4_spline_spacing:
    help: "Spline spacing (in mm) for the lowest-res grid, will halve 3 times for the total 4 multi-res levels (default: %(default)s). Decreasing this number allows for sharper correction fields."
    default: 2
    type: float


  --seg_method:
    help: >
      Method(s) to use for microscopy segmentation (e.g. plaques, protein
      deposits, cells) applied to 'stains_for_seg' channels.

      Supported methods:

      ``th<value>`` – simple fixed intensity threshold, e.g. ``th500`` applies
      a threshold of 500.

      ``otsu+k<k>i<i>`` – multi-level Otsu thresholding.  Fits k intensity
      classes to the global histogram and uses threshold index i (0-based) as
      the segmentation boundary.  Example: ``otsu+k3i2`` fits 3 classes and
      selects the 2nd threshold (between the 2nd and 3rd class).

      ``gmm+n<n>k<k>`` – Gaussian Mixture Model (GMM) tail-thresholding.
      Fits a GMM with n components to the log1p-transformed global intensity
      histogram, sorts the components by mean intensity ascending, and defines
      the threshold from the highest-intensity component as
      ``threshold = expm1(mean_n + k * sigma_n)``.  The float multiplier k
      may be encoded with 'p' as a decimal separator to keep BIDS-compatible
      filenames, e.g. ``gmm+n2k2p5`` → n=2, k=2.5.

      ``lantern`` – 5-fold LANTERN deep-learning ensemble for amyloid-beta
      plaques (which ensemble is chosen with ``--lantern_config``).  Unlike
      the histogram-based methods above it reads raw intensities (not the
      bias-field-corrected image) and runs on the grid nearest
      ``plaque_iso_res`` (~4 µm isotropic, the scale it was trained at); the
      mask at ``segmentation_level`` is that prediction upsampled.  Requires
      a GPU.

      Also unlike them, it is stain-specific: it runs only on the first stain
      from ``stains_for_plaques``.  The remaining stains in ``stains_for_seg``
      use the other methods given here, or -- if ``lantern`` was the only one --
      this option's own default, so they behave exactly as if it had not been
      passed.
    default:
      - gmm+n3k1
    nargs: '+'

  --lantern_config:
    help: >
      Which LANTERN ensemble ``--seg_method lantern`` runs, as
      ``<name>[@<revision>]``.  ``<name>`` selects the Hugging Face repo
      ``apooladi/lantern-<name>``; every such repo is laid out like
      ``lantern-ki3-abeta`` (``fold<k>/seg_model.pt`` ResEncLUNet
      checkpoints for k in 0..plaque_n_folds-1), so any of them works here.
      ``<revision>`` is a tag, branch or commit of that repo and defaults to
      ``main`` when omitted; the default ensemble is pinned to the ``v2`` tag so
      a new upload cannot silently change results.  Examples:
      ``ki3-abeta@v2``, ``mapt_a-abeta``, ``ki3-abeta@main``.
      (default: %(default)s)
    default: ki3-abeta@v2
    type: str

  --min_size:
    help: >
      LANTERN only.  Plaque connected components (26-connectivity) smaller
      than this many voxels on the near-isotropic inference grid are dropped
      before the mask is upsampled to ``segmentation_level``.  The near-iso
      probseg itself keeps them.  0 disables the filter.  (default: %(default)s)
    default: 4
    type: int

  --label_filter:
    help: >
      LANTERN only, 3-class ensembles only (ignored, with a note, for binary
      ones).  Also drop plaque components that touch a class-2 ("annotated
      false positive": bright non-plaque structure) component of at least
      ``label_filter_size`` near-iso voxels (default 10, set in the config).
      Decided on the near-iso grid; the probseg is unchanged.
    action: store_true
    default: False

  --merge_mode:
    dest: plaque_merge_mode
    help: >
      LANTERN only.  How the fold votes of overlapping inference tiles are
      combined (every voxel is covered by up to 8 tiles at the default
      stride).  ``average`` takes the mean over the tiles, so a tile that saw
      the voxel at its edge with little context (e.g. at the brain surface)
      is outvoted by the others.  ``gaussian`` is a weighted mean in which
      tiles count more near their centre.  ``max`` keeps the highest count,
      as published LANTERN inference does; it recovers plaques clipped at
      one tile's edge but lets a single bad tile win, which shows up as
      tiling artifacts.  Applies to the plaque and, for 3-class ensembles,
      the class-2 channel alike.  With ``average``/``gaussian`` the vote map
      is fractional and a voxel is plaque when its mean vote is at least
      ``plaque_vote_threshold`` - 0.5.  (default: %(default)s)
    choices:
      - average
      - gaussian
      - max
    default: average

  --seg_hist_percentile_range:
    help: "Percentile range to use for histogram calculation in histogram-based segmentation methods (otsu+k{}i{} and gmm+n{}k{}). Specify 2 numbers for the low and high percentiles (default: %(default)s)"
    default:
      - 1
      - 99.5
    nargs: 2
    type: float

  --seg_hist_bin_width:
    help: "Bin width to use for histogram calculation in histogram-based segmentation methods (otsu+k{}i{} and gmm+n{}k{}). (default: %(default)s)"
    default: 1
    type: float


  --register_to_mri:
    help: "Register the lightsheet data directly to a corresponding MRI (from the BIDS dataset)"
    action: store_true
    default: False

  --template_mri:
    help: "Template to use for MRI registration to obtain brain mask\n"
    default: MouseIn
    choices:
      - MouseIn
      - DSURQE
      - MBMv3
      - turone

  --mri_resample_percent:
    help: "Resampling factor for multi-MRI averaging to create super-resolved images, as a percent (default: %(default)s). Use 200 for upsampling to twice the resolution"
    default: 100

  --orientation:
    help: "Forcefully set the orientation for all input SPIM datasets. When absent, orientation is read from OME-Zarr metadata and overridden by _SPIM.json sidecars if present (with the JSON key OrientationStringXYZ). CLI values take highest precedence. Note, this orientation string is defined in XYZ, with the letter of the increasing direction. Generally speaking, Blaze data stitched with SPIMprep should be RPI, Imaris stitched data should be RAI, and Lifecanvas stitched data should be RAS (though this may differ if brains are upside down, etc...) "
    default: null
    

  --dask_scheduler:
    help: "Dask scheduler to use for parallel processing in workflow scripts (default: %(default)s)"
    choices:
      - threads
      - distributed
    default: distributed

  --qc_instance_seg:
    help: "Generate instance-level QC outputs, including animated gifs (default: %(default)s)"
    action: store_true
    default: False

  --qc_roi_zoom_bg_n4:
    help: "Use n4 bias-field corrected OME-Zarr as background image in the ROI zoom montage QC figures instead of the raw SPIM (only effective when --correction_method n4) (default: %(default)s)"
    action: store_true
    default: False

  --zarr-store-ext:
    help: "File format for intermediate OME-Zarr stores: 'ome.zarr' (directory) or 'ozx' (single zip file) (default: %(default)s)"
    choices:
      - ome.zarr
      - ozx
    default: ozx
    dest: zarr_store_ext

  --zarr-store-chunks:
    help: "Chunk size (c, x, y, z) for intermediate OME-Zarr stores (default: %(default)s)"
    default:
      - 1
      - 256
      - 256
      - 256
    nargs: 4
    type: int
    dest: zarr_store_chunks

  --zarr-store-shards:
    help: "Shard size (c, x, y, z) for intermediate OME-Zarr stores. Disabled by default and when --zarr-store-ext is 'ozx'."
    default: null
    nargs: 4
    type: int
    dest: zarr_store_shards

  --reuse_derivatives:
    help: "Path to an existing SPIMquant output dataset to reuse outputs from (see --reuse_outputs), instead of computing them again. Files are matched by the same BIDS paths SPIMquant writes, so they are only reused when the relevant settings (e.g. --template, --registration_level) match; anything not found is computed as usual. Reused files are copied into the output directory (see --reuse_symlink)."
    default: null

  --reuse_symlink:
    help: "Symlink reused files from --reuse_derivatives instead of copying them. Saves disk space (composite warps are ~1.5 GB per subject), but the output dataset then depends on the prior dataset staying in place."
    action: store_true
    default: False

  --reuse_outputs:
    help: "Which outputs to reuse from --reuse_derivatives (default: %(default)s). 'brainmask' reuses the SPIM brain masks, 'transforms' the composite subject<->template warps. The registration QC report is skipped for subjects whose transforms are reused."
    choices:
      - brainmask
      - transforms
    default:
      - brainmask
      - transforms
    nargs: '+'

  --sloppy:
    help: "Use low-quality parameters for speed (USE FOR TESTING ONLY)"
    action: store_true
    default: False


  --skip-bids-validation:
    help: |
      Skip validation of BIDS dataset. BIDS validation is performed by
      default using the bids-validator plugin (if installed/enabled) or with the pybids
      validator implementation (if bids-validator is not installed/enabled).
    dest: "plugins.validator.skip"
    action: "store_true"
    default: False

  --patch_size:
    help: "Size of patches to extract in voxels (x, y, z) (default: %(default)s)"
    default:
      - 256
      - 256
      - 256
    nargs: 3
    type: int

  --patch_atlas_segs:
    help: "Atlas segmentations to use for extracting patches (default: coarse)"
    default:
      - coarse
    action: store
    nargs: '+'


  --n_patches_per_label:
    help: "Number of patches to extract per atlas label (default: %(default)s)"
    default: 5
    type: int

  --patch_labels:
    help: "List of atlas label names, abbreviations, or indices to extract patches from. If not specified, patches are extracted from all labels."
    default: null
    nargs: '+'

  --patch_seed:
    help: "Random seed for reproducible patch sampling (default: %(default)s)"
    default: 42
    type: int

  --crop_labels:
    help: "List of atlas label names, abbreviations, or indices to extract as Imaris crops. If not specified, all labels are cropped."
    default: null
    nargs: '+'

  --crop_atlas_segs:
    help: "Atlas segmentations to use for extracting Imaris crops (default: coarse)"
    default:
      - coarse
    action: store
    nargs: '+'

  --no_patch_uint8:
    help: "Disable conversion of patch NIfTI files to uint8 using robust percentile scaling. By default, patches are converted to uint8 to avoid endianness issues in downstream applications (e.g. SyGlass). (default: %(default)s)"
    action: store_true
    default: False

  --bbox_config:
    help: >
      Path to a YAML file defining custom bounding boxes for extracting cropped regions
      at full resolution in template space. Each entry specifies a name, xyz coordinates
      in template space (in mm by default), bounding box size in voxels, and the desired
      isotropic output resolution in microns. A special entry with use_brain_mask: true
      extracts the whole-brain region defined by the template brain mask.
      Example YAML format:
        bounding_boxes:
          - name: entorhinal
            x: 5.2
            y: -2.3
            z: -1.8
            units: mm
            size: [256, 256, 256]
            resolution_um: 20
            input_level: 0
          - name: wholebrain
            use_brain_mask: true
            resolution_um: 100
            input_level: 2
    default: null
    type: str

  --group-stats-model:
    help: "Statistical model formula in patsy/statsmodels format, with 'metric' as a placeholder for the response variable (e.g. 'metric ~ C(treatment) * C(genotype) + age'). Required when using --group-stats-pairwise."

  --group-stats-pairwise:
    help: "Factor(s) in participants.tsv for which all pairwise comparisons should be computed. Can be specified multiple times (e.g. '--group-stats-pairwise treatment --group-stats-pairwise genotype'). Requires --group-stats-model."
    default: null
    nargs: '+'

  --group-stats-within:
    help: "Factors defining strata within which pairwise contrasts are computed (e.g. '--group-stats-within genotype sex'). All combinations of these factor levels will be used as separate strata."
    default: null
    nargs: '+'

  --group-stats-where:
    help: "Pandas query expression applied to the participants.tsv rows before model fitting and contrast enumeration. Subjects not matching the expression are excluded from the inference cohort (model + contrasts). Example: \"treatment in ['pbs', 'lecanemab'] and qc_pass == 1\". Backward-compatible: omitting this option includes all subjects."
    default: null

  --group-stats-label:
    help: "Label for this group-stats run. Outputs are placed under group/{label}/ so that different analyses (e.g. different models or --group-stats-where filters) do not overwrite each other. (default: %(default)s)"
    default: "1"

  --cohort-template-name:
    help: "Name (tpl- label) for the cohort template built by the cohort_template analysis level. Must be alphanumeric and must not clash with an existing --template choice. (default: %(default)s)"
    default: cohort

  --cohort-template-stains:
    help: "Stains to build the cohort template from. All stains are built jointly as one multivariate template, so every stain template shares the same space. (default: all stains)"
    default: null
    nargs: '+'

  --cohort-template-level:
    help: "Downsampling level of the subject images (already warped to --template space) used to build the cohort template (default: --registration_level)"
    default: null
    type: int

  --cohort-template-iterations:
    help: "Number of FireANTs template-building iterations (default: %(default)s)"
    default: 10
    type: int

  --cohort-template-resample-mm:
    help: "Isotropic voxel size (mm) to resample the subject images to before building the cohort template, e.g. 0.05. Lowers GPU memory use and run time, e.g. for a finer --cohort-template-level or --template. (default: --template resolution)"
    default: null
    type: float

  --cohort-template-n-gpus:
    help: "Number of GPUs for FireANTs template building; subjects are split across GPUs (default: %(default)s)"
    default: 1
    type: int

  --cohort-template-extra-inputs:
    help: "Additional SPIMquant output directories (from other datasets registered to the same --template) whose subjects are added to the cohort template. Subject images are found by globbing for the same space/level/stain files in each directory."
    default: null
    nargs: '+'

  --cohort-template-zenodo-deposition:
    help: "Zenodo deposition ID (an unpublished draft you created) to upload the exported cohort template to, in the cohort_template_export analysis level. Requires SNAKEMAKE_STORAGE_ZENODO_ACCESS_TOKEN to be set. When absent, the export is only prepared locally. (default: %(default)s)"
    default: null
    type: int

  --benchmark:
    help: "Record the run time, peak memory and CPU use of every job to benchmarks/{rule}/*.jsonl in the output folder, along with the threads and resources each job requested. Use for tuning the resources of each rule. (default: %(default)s)"
    action: store_true
    default: False


#--- workflow specific configuration -- 


ome_zarr:
  max_downsampling_layers: 4 # e.g. 4 levels: { 0: orig, 1: ds2, 2: ds4, 3: ds8, 4: ds16}
  rechunk_size: #z, y, x
    - 1 
    - 1024
    - 1024
  scaling_method: 'local_mean' #can be nearest, gaussian, local_mean, zoom (zoom uses spline interp)

# Template files are listed from sources, and selected by the components below
# using snakebids-templates. Sources are searched in the order given, so files
# pre-downloaded into resources/imported/ are used before remote copies.
templates:
  sources:
    imported: # pre-downloaded copies of remote files (flat tpl-X_*.nii.gz names)
      type: local
      path: ../resources/imported
      optional: true
    resources:
      type: local
      path: ../resources
    abav3:
      type: zenodo
      record: 18906782
    abav3_spim:
      type: zenodo
      record: 20057848
    dsurqe:
      type: manifest
      files:
        tpl-DSURQE/tpl-DSURQE_anat.nii: https://www.mouseimaging.ca/repo/DSURQE_40micron/Dorr_2008_Steadman_2013_Ullmann_2013_Richards_2011_Qiu_2016_Egan_2015_40micron/nifti/DSURQE_40micron_average.nii
        tpl-DSURQE/tpl-DSURQE_desc-brain_mask.nii: https://www.mouseimaging.ca/repo/DSURQE_40micron/Dorr_2008_Steadman_2013_Ullmann_2013_Richards_2011_Qiu_2016_Egan_2015_40micron/nifti/DSURQE_40micron_mask.nii
        tpl-DSURQE/tpl-DSURQE_seg-all_dseg.nii: https://www.mouseimaging.ca/repo/DSURQE_40micron/Dorr_2008_Steadman_2013_Ullmann_2013_Richards_2011_Qiu_2016_Egan_2015_40micron/nifti/DSURQE_40micron_labels.nii
        tpl-DSURQE/tpl-DSURQE_seg-all_mapping.csv: https://www.mouseimaging.ca/repo/DSURQE_40micron/Dorr_2008_Steadman_2013_Ullmann_2013_Richards_2011_Qiu_2016_Egan_2015_40micron/mappings/DSURQE_40micron_R_mapping.csv

  components:
    anat: # reference image for MRI-like registration, first match wins
      path:
        - tpl-{tpl}/tpl-{tpl}_anat.nii.gz
        - tpl-{tpl}/tpl-{tpl}_T2w.nii.gz
        - tpl-{tpl}/tpl-{tpl}_res-1_inv-1_MP2RAGE.nii.gz
        - tpl-{tpl}/tpl-{tpl}_anat.nii
    mask:
      path:
        - tpl-{tpl}/tpl-{tpl}_desc-brain_mask.nii.gz
        - tpl-{tpl}/tpl-{tpl}_res-1_desc-brain_mask.nii.gz
        - tpl-{tpl}/tpl-{tpl}_desc-brain_mask.nii
    spim: # stain-specific SPIM templates
      path:
        - tpl-{tpl}/tpl-{tpl}_level-{level}_stain-{stain}_SPIM.nii.gz
        - tpl-{tpl}/tpl-{tpl}_stain-{stain}_SPIM.nii.gz # cohort templates
    dseg:
      path:
        - tpl-{tpl}/tpl-{tpl}_seg-{seg}_dseg.nii.gz
        - tpl-{tpl}/tpl-{tpl}_seg-{seg}_dseg.nii
      filters:
        seg: # tissue-class segmentations, not atlases
          search: '^(?!\d+tissue$)'
    lut:
      path: tpl-{tpl}/tpl-{tpl}_seg-{seg}_dseg.tsv
    lut_csv: # label mappings needing conversion to tsv (DSURQE)
      path: tpl-{tpl}/tpl-{tpl}_seg-{seg}_mapping.csv

# Per-template settings that are app policy, not template files
template_settings:
  ABAv3:
    default_segs: [all, coarse, mid, fine]
    spim_stains: [YoPro, Iba1, CD31, Abeta] # in priority order

models:
  vesselfm: https://huggingface.co/bwittmann/vesselFM/resolve/main/vesselFM_base.pt
  # URL template for one fold of a LANTERN ensemble. {name} and {revision}
  # come from --lantern_config (<name>[@<revision>], revision defaults to
  # main), {fold} from 0..plaque_n_folds-1. Every apooladi/lantern-* repo
  # follows the lantern-ki3-abeta layout, so this one template covers all of
  # them.
  lantern: https://huggingface.co/apooladi/lantern-{name}/resolve/{revision}/fold{fold}/seg_model.pt


  
templatereg:
  desc: N4brain
  zooms:
    - 40

masking:
  gmm_init_k: 9
  gmm_min_k: 2
  gmm_bg_class: 1
  pre_atropos_downsampling: '50%'
  prior_sigma_mm: 0.2 # blurring of the affine-warped template mask, to allow for registration error
  prior_margin_mm: 0.3 # erode/dilate prior by this much to define confident brain/background for class likelihoods
  grow_mm: 1.0 # max distance to grow the mask into strongly brain-like classes (0 to disable)
  grow_min_lr: 20 # min brain:background likelihood ratio of a class for growing into it

zarrnii_out_kwargs:
  storage_options: {}

cohort_template:
  # subject images are clipped to these percentiles (of nonzero voxels) and
  # rescaled to [0,1] before template building, so bright outliers (e.g.
  # plaques) do not dominate FireANTs' min-max normalization
  clip_percentiles: [0.5, 99.5]
  # registration of the original template (moving) to the cohort template (fixed)
  reg:
    metric: NMI
    affine_iters: 100x50x0
    deform_iters: 100x50x0
    sigma1: 4vox
    sigma2: 2vox
  # FireANTs build_template config (image_list_file, save_dir and
  # template_iterations are filled in by the workflow)
  fireants:
    debug: False
    verbose: False
    image_prefix: null
