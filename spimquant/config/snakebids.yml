      itk_scale: true
    # shape averaging runs an extra full-resolution registration per iteration
    # (and OOMs at 25um on a 40GB GPU); the init template is already the subject
    # average in --template space, and without it the subjects fit better
    shape_avg: false
    save_every: 1
    save_init_template: true
    save_moved_images: true
    save_additional:
      image_file: []
      image_prefix: []
      image_suffix: []
      is_segmentation: []
    batch_size: 1
    do_moments: False
    moments:
      scale: 4
      moments: 1
    do_rigid: False
    rigid:
      iterations: [200, 100, 25]
      scales: [4, 2, 1]
      progress_bar: False
      loss_type: cc
    do_affine: False
    affine:
      iterations: [200, 100, 25]
      scales: [4, 2, 1]
      progress_bar: False
      loss_type: cc
    do_deform: True
    deform_algo: greedy
    deform:
      iterations: [200, 100, 50]
      scales: [4, 2, 1]
      optimizer_lr: 0.25
      smooth_warp_sigma: 0.5
      smooth_grad_sigma: 1.0
      progress_bar: False
