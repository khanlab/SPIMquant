name: fireants
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    # PyPI torch wheels bundle the CUDA runtime, so the env can be created on a
    # node without a GPU. FireANTs pins simpleitk==2.2.1, which is why it lives in
    # its own env instead of the main pixi environment.
    - torch==2.5.1
    # khanlab fork; multi-stain templates need the per-channel template saving
    # in build_template.py (template_{epoch}_ch-{c}.nii.gz)
    - fireants @ git+https://github.com/khanlab/FireANTs@a812cd1b16837ed3c0f62675eaa9d8e67f2a4ee9
