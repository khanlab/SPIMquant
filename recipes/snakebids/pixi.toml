# snakebids built from a branch, for SPIMquant's `mind` environment (see pyproject.toml).
#
# The branch (khanlab/snakebids#remote-bids-dir) accepts a URL such as mind://... as bids_dir. snakebids' own
# [tool.pixi.package] would build it straight from git, but with the placeholder version 0.0.0.dev0 (the publish
# workflow sets the real one from the release tag), which SPIMquant's `snakebids >=0.17` rejects. This manifest
# names a version and otherwise matches snakebids' own: the run dependencies come from its pyproject.toml.
# Remove it once the branch is released.
[package]
name = "snakebids"
version = "0.17.1.dev0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }
source = { git = "https://github.com/khanlab/snakebids.git", branch = "remote-bids-dir" }

[package.build.config]
noarch = true
ignore-pypi-mapping = false

[package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[package.run-dependencies]
# as in snakebids' pyproject.toml: deps with python_version markers are dropped by the conversion
snakemake = ">=7.18.2"
