# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs are built in the pixi `docs` environment, which has snakebids:
# docs/hooks.py reads the CLI parser and the config to generate the reference
# pages (see AGENTS.md).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - NO_MKDOCS_2_WARNING=1 $HOME/.pixi/bin/pixi run -e docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
